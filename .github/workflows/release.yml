name: Release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
          - os: macos-latest
            os_name: macos
          - os: windows-latest
            os_name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC toolchain (Linux)
        if: matrix.os_name == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 cmake ninja-build

      - name: Configure (Linux GCC)
        if: matrix.os_name == 'linux'
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13

      - name: Configure (macOS/Windows)
        if: matrix.os_name != 'linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target cpmdisk

      - name: Package (Linux/macOS)
        if: matrix.os_name != 'windows'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          ARCH_RAW="$(uname -m)"
          case "${ARCH_RAW}" in
            x86_64|amd64) ARCH="x86_64" ;;
            aarch64|arm64) ARCH="arm64" ;;
            *) ARCH="${ARCH_RAW}" ;;
          esac

          PLATFORM="${{ matrix.os_name }}-${ARCH}"
          STAGE_NAME="cpmdisk-${VERSION}-${PLATFORM}"
          STAGE_DIR="release/${STAGE_NAME}"
          ARCHIVE_NAME="cpmdisk-${PLATFORM}-${VERSION}.tar.gz"

          rm -rf release
          mkdir -p "${STAGE_DIR}"

          cp "bin/cpmdisk" "${STAGE_DIR}/"
          if [ "${{ matrix.os_name }}" = "linux" ]; then
            cp "bin/libcpmdisk.so" "${STAGE_DIR}/"
          else
            cp "bin/libcpmdisk.dylib" "${STAGE_DIR}/"
          fi
          cp -R "include" "${STAGE_DIR}/include"
          cp LICENSE "${STAGE_DIR}/LICENSE"

          {
            echo "cpmdisk ${VERSION}"
            echo
            echo "Release package for cpmdisk (${PLATFORM})."
            echo
            echo "Contents:"
            echo "- cpmdisk"
            if [ "${{ matrix.os_name }}" = "linux" ]; then
              echo "- libcpmdisk.so"
            else
              echo "- libcpmdisk.dylib"
            fi
            echo "- include/cpmdisk/cpmdisk.h"
            echo "- include/cpmdisk/*.h"
            echo "- LICENSE"
          } > "${STAGE_DIR}/README-release.txt"

          tar -C release -czf "release/${ARCHIVE_NAME}" "${STAGE_NAME}"

      - name: Package (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $archRaw = $env:PROCESSOR_ARCHITECTURE
          $arch = if ($archRaw -eq 'AMD64') { 'x86_64' } elseif ($archRaw -eq 'ARM64') { 'arm64' } else { $archRaw.ToLower() }

          $platform = "windows-$arch"
          $stageName = "cpmdisk-$version-$platform"
          $stageDir = "release/$stageName"
          $archiveName = "cpmdisk-$platform-$version.zip"

          if (Test-Path release) { Remove-Item -Recurse -Force release }
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          $exe = Get-ChildItem -Path bin -Filter cpmdisk.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "cpmdisk.exe not found under bin/" }
          $dll = Get-ChildItem -Path bin -Filter cpmdisk.dll -Recurse | Select-Object -First 1
          if (-not $dll) { throw "cpmdisk.dll not found under bin/" }
          $implib = Get-ChildItem -Path bin -Filter cpmdisk.lib -Recurse | Select-Object -First 1

          Copy-Item $exe.FullName "$stageDir/cpmdisk.exe"
          Copy-Item $dll.FullName "$stageDir/cpmdisk.dll"
          if ($implib) { Copy-Item $implib.FullName "$stageDir/cpmdisk.lib" }
          Copy-Item -Recurse include "$stageDir/include"
          Copy-Item LICENSE "$stageDir/LICENSE"

          @(
            "cpmdisk $version"
            ""
            "Release package for cpmdisk ($platform)."
            ""
            "Contents:"
            "- cpmdisk.exe"
            "- cpmdisk.dll"
            if ($implib) { "- cpmdisk.lib" }
            "- include/cpmdisk/cpmdisk.h"
            "- include/cpmdisk/*.h"
            "- LICENSE"
          ) | Set-Content "$stageDir/README-release.txt"

          Compress-Archive -Path "$stageDir/*" -DestinationPath "release/$archiveName"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os_name }}
          path: |
            release/*.tar.gz
            release/*.zip

  publish-release:
    needs: build-package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Compute version
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          RELEASE_DATE="$(date -u '+%b %-d, %Y')"
          BODY_FILE="release/release-notes.txt"
          CHANGES_FILE="release/changes.txt"

          PREV_TAG="$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)"
          if [ -n "${PREV_TAG}" ]; then
            git log --no-merges --pretty='- %s' "${PREV_TAG}..${TAG}" > "${CHANGES_FILE}" || true
          else
            git log --no-merges --pretty='- %s' "${TAG}" > "${CHANGES_FILE}" || true
          fi
          if [ ! -s "${CHANGES_FILE}" ]; then
            printf '%s\n' "- Maintenance release" > "${CHANGES_FILE}"
          fi

          {
            echo "v${VERSION}"
            echo "Released ${RELEASE_DATE}"
            echo
            echo "What's changed"
            cat "${CHANGES_FILE}"
            echo
            echo "Assets"
            ls -1 release/*.tar.gz release/*.zip 2>/dev/null | sed 's#^release/#- #' || true
          } > "${BODY_FILE}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.meta.outputs.version }}
          body_path: release/release-notes.txt
          files: |
            release/*.tar.gz
            release/*.zip
